# vibration — XcodeGen spec.
#
#   xcodegen generate
#   xcodebuild archive -project vibration.xcodeproj -scheme vibration ...
#
# The .xcodeproj is intentionally NOT committed: CI regenerates it from this
# file, so the project definition stays human-readable and merge-friendly.

name: vibration

options:
  bundleIdPrefix: com.homikori
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  vibration:
    type: application
    platform: iOS
    sources:
      - path: vibration
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.homikori.vibration
        PRODUCT_NAME: vibration
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SDKROOT: iphoneos

schemes:
  vibration:
    build:
      targets:
        vibration: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
