name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibration-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vibration — unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -list -project vibration.xcodeproj

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project vibration.xcodeproj \
            -scheme vibration \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/vibration.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package vibration.ipa
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/vibration.xcarchive/Products/Applications/vibration.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find "$RUNNER_TEMP/vibration.xcarchive/Products" -maxdepth 5 -type d -name 'vibration.app' -print -quit)"
          fi
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          rm -rf build
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/vibration.app

          echo "--- Info.plist ---"
          plutil -p build/Payload/vibration.app/Info.plist | head -60
          test -f build/Payload/vibration.app/vibration
          file build/Payload/vibration.app/vibration
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/Payload/vibration.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' build/Payload/vibration.app/Info.plist

          cd build
          /usr/bin/zip -r -y vibration.ipa Payload
          echo "--- IPA contents (first 40) ---"
          unzip -l vibration.ipa | head -40
          ls -lh vibration.ipa
          cp vibration.ipa "$GITHUB_WORKSPACE/vibration.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibration-ipa
          path: vibration.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/vibration.app/Info.plist || echo 1.0.0)"
          TAG="v${VERSION}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "## vibration ${VERSION}"
            echo
            echo "Нативное iOS-приложение в палитре вино/золото/графит: вибрация в такт басам"
            echo "(Accelerate FFT + Core Haptics), 3D-сканер глубины (LiDAR / TrueDepth),"
            echo "тактильный парктроник и вкладка «Тап» с щелчками на каждое касание."
            echo
            echo "Неподписанная сборка (\`CODE_SIGNING_ALLOWED=NO\`) — устанавливается через AltStore / SideStore / Sideloadly."
            echo
            echo "* commit: \`${GITHUB_SHA}\`"
            echo "* workflow run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo "* bundle: \`com.homikori.vibration\`, минимум iOS 15.0, arm64 (iPhone XS Max и новее)"
          } > "$NOTES"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" vibration.ipa --repo "$REPO" --clobber
          else
            gh release create "$TAG" vibration.ipa \
              --repo "$REPO" \
              --title "vibration ${TAG}" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### vibration build"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| runner | $RUNNER_OS |"
            echo "| status | ${{ job.status }} |"
            echo "| sha | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
